deepseek:
  api_key: sk-b41ef9428d5740979ecc433a539b0fd9 # 替换为你的 DeepSeek API Key
  base_url: https://api.deepseek.com # 推荐使用这个，或者 https://api.deepseek.com/v1 也可以
  model: deepseek-chat # 或者 deepseek-reasoner，根据你需要哪个模型
  max_per_tokens: 40000 # 这个值你可以根据DeepSeek的实际限制或你自己的需求来设置
project:
  config_file_ext:
  - .yaml
  - .xml
  - .json
  - .conf
  - .ini
  - .toml
  - .config
  - .settings
  exclude_dir:
  - node_modules
  - dist
  - build
  - out
  - venv
  - .venv
  - env
  - target
  - vendor
  - bower_components
  - .git
  - .svn
  - .hg
  - .idea
  - .vscode
  - .metadata
  - nbproject
  - test
  - tests
  - spec
  - specs
  - tmp
  - temp
  - cache
  - logs
  - docker
  - containers
  - k8s
  - kube
  - .circleci
  - .github
  - .travis
  - docs
  - doc
  - .secrets
  - .env
  exclude_max_file_size: 1
  source_file_ext:
  - .py
  - .go
  - .js
  - .java
  - .cpp
  - .php
  - .aspx
  - .asp
  - .c
  - .cs
  - .h
